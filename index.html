<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="generator" content="Microsoft FrontPage 5.0">
<meta name="author" content="System">
<title>…</title>
<link rel="icon" href="image.jpg" type="image/jpeg">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Courier New", Courier, monospace;
    color: #8a8a8a;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  body {
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* ---------- START SCREEN ---------- */
  #start {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 10;
    cursor: pointer;
    gap: 12px;
  }
  #start span {
    color: #8a8a8a;
    font-size: 18px;
    letter-spacing: 2px;
  }

  /* Эффект мерцания только для первой строки */
  #start-text {
    animation: flicker 4s infinite;
  }

  /* Вторая подпись плавно проявляется */
  #sub-text {
    font-size: 14px;
    color: #555;
    opacity: 0;
    transition: opacity 1.5s ease-in;
  }
  #sub-text.visible {
    opacity: 1;
  }

  #start.hidden {
    display: none;
  }

  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.35; }
    22% { opacity: 0.7; }
  }

  /* ---------- MAIN STAGE ---------- */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.8s ease-in;
  }
  #stage.visible {
    opacity: 1;
  }

  #mystery {
    max-width: 60vw;
    max-height: 60vh;
    opacity: 0;
    transition: opacity 6s linear;
    filter: contrast(120%) brightness(0.6);
    pointer-events: none;
  }
  #mystery.loaded {
    opacity: 0.85;
  }

  /* ---------- CODE INPUT ---------- */
  #codebox {
    position: fixed;
    bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    opacity: 0;
    transition: opacity 0.8s ease-in 1s;
    width: min(400px, calc(100vw - 40px));
  }
  #codebox.visible {
    opacity: 1;
  }
  #codebox label {
    display: block;
    font-size: 13px;
    letter-spacing: 2px;
    color: #555;
    margin-bottom: 8px;
  }
  #code {
    background: transparent;
    border: none;
    border-bottom: 1px solid #333;
    color: #999;
    font-family: inherit;
    font-size: 16px;           /* 16px — чтобы iOS не зумил при фокусе */
    letter-spacing: 4px;
    text-align: center;
    outline: none;
    width: 220px;
    max-width: 100%;
    padding: 6px 0;
    user-select: text;
    -webkit-user-select: text;
  }
  #code:focus {
    border-bottom-color: #666;
  }
  #msg {
    margin-top: 14px;
    font-size: 12px;
    letter-spacing: 1px;
    color: #6a2a2a;
    min-height: 16px;
    opacity: 0;
    transition: opacity 2s ease-out;
  }
  #msg.show {
    opacity: 1;
    transition: opacity 0.7s ease-in;
  }
</style>
</head>
<body>

  <div id="start">
    <span id="start-text">Click to enter...</span>
    <span id="sub-text"></span>
  </div>

  <audio id="track" loop>
    <source src="websound.mp3" type="audio/mpeg">
  </audio>

  <div id="stage">
    <img id="mystery" src="image.jpg" alt="">

    <div id="codebox">
      <label>enter your code</label>
      <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" spellcheck="false" maxlength="8">
      <div id="msg"></div>
    </div>
  </div>

<script>
  const start     = document.getElementById('start');
  const startText = document.getElementById('start-text');
  const subText   = document.getElementById('sub-text');
  const stage     = document.getElementById('stage');
  const audio     = document.getElementById('track');
  const img       = document.getElementById('mystery');
  const codebox   = document.getElementById('codebox');
  const input     = document.getElementById('code');
  const msg       = document.getElementById('msg');

  let msgTimeout = null;

  // ===== Посещения (с 3-го визита) =====
  let visitCount = 0;
  try {
    visitCount = parseInt(localStorage.getItem('visitCount') || '0', 10) || 0;
    visitCount += 1;
    localStorage.setItem('visitCount', String(visitCount));
  } catch (e) {
    visitCount = 0;
  }

  if (visitCount >= 3) {
    startText.textContent = 'Welcome back.';
    subText.textContent = 'click to enter...';

    setTimeout(() => {
      subText.classList.add('visible');
    }, 1500);
  }

  // Статичный код
  const VALID_CODE = '20040414';

  start.addEventListener('click', () => {
    audio.volume = 0.4;
    const p = audio.play();
    if (p && typeof p.catch === 'function') p.catch(() => {});

    start.classList.add('hidden');
    setTimeout(() => stage.classList.add('visible'), 50);
    setTimeout(() => img.classList.add('loaded'), 100);
    setTimeout(() => codebox.classList.add('visible'), 400);
    setTimeout(() => input.focus(), 800);
  });

  // Только цифры, максимум 8
  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 8);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!input.value) return;

      const code = input.value;

      if (msgTimeout) clearTimeout(msgTimeout);

      if (code === VALID_CODE) {
        msg.textContent = 'access for this code has been revoked. contact administration.';
        msg.classList.add('show');
        input.value = '';
        msgTimeout = setTimeout(() => {
          msg.classList.remove('show');
        }, 4000);
      } else {
        msg.textContent = 'no such code exists';
        msg.classList.add('show');
        input.value = '';
        msgTimeout = setTimeout(() => {
          msg.classList.remove('show');
        }, 2000);
      }
    }
  });
</script>

</body>
</html>
