  /* ---------- START SCREEN ---------- */

  @keyframes flicker {

  /* ---------- SHARED LABEL / INPUT STYLE ---------- */

  /* ---------- DECAY OVERLAY ---------- */
  #decay {
    position: fixed;

    z-index: 20;

      repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 3px),

  #decay.visible {

  #decay.flash {

  }
  .glitch-bar {

    mix-blend-mode: difference;

  /* ---------- PSYCHEDELIC MESSAGE STAGE ---------- */
  #psycho {
    position: fixed;

    z-index: 21;
    background: #000;
    display: flex;
    align-items: center;

    opacity: 0;
    pointer-events: none;

  #psycho.visible {

  #psycho-text {
    text-align: center;
    font-size: clamp(16px, 4vw, 27px);

  #psycho-text.show {

  /* ---------- COMMENT INPUT ---------- */
  #commentbox {
    position: fixed;
    inset: 0;
    z-index: 21;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease-in;
  }
  #commentbox.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #comment {
    width: min(480px, calc(100vw - 60px));
    letter-spacing: 1px;
  }

  /* ---------- SCREAMER ---------- */
  #screamer {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
  }
  #screamer.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #screamer-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ---------- FINAL LINK ---------- */
  #finalLink {
    position: fixed;
    bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    opacity: 0;
    transition: opacity 1.2s ease-in;
    width: min(400px, calc(100vw - 40px));
  }
  #finalLink.visible {
    opacity: 1;
  }
  #tg-link {
    color: #999;
    text-decoration: none;
    letter-spacing: 3px;
    font-size: 15px;
    border-bottom: 1px solid #333;
    padding-bottom: 4px;
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  @media (hover: hover) {
    #tg-link:hover {
      color: #ccc;
      border-color: #666;
    }

<script>
/* session layer v2.3 - gateway handshake, presence, access state */
(function () {
  'use strict';
  function h32(s) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    h ^= h >>> 15; h = Math.imul(h, 2246822507) >>> 0;
    h ^= h >>> 13; h = Math.imul(h, 3266489909) >>> 0;
    h ^= h >>> 16; return h >>> 0;
  }
  var K = { 1: 841981507, 2: 1933059961 };
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var seed = get('vk_seed');
  if (!seed) {
    try { var a = new Uint32Array(2); crypto.getRandomValues(a); seed = String(((a[0] ^ (a[1] << 1)) >>> 0) % 1e8).padStart(8, '0'); }
    catch (e) { seed = String(Math.floor(Math.random() * 1e8)).padStart(8, '0'); }
    put('vk_seed', seed);
  }
  var mask = parseInt(get('vk_mask') || '0', 10) || 0;

  function personal(i) {
    var x = h32(seed + ':' + i + ':a'), y = h32(seed + ':' + i + ':b');
    return String((x % 10000) * 10000 + (y % 10000)).padStart(8, '0');
  }
  var PAGE_CODE = { catalog: 3, faq: 4, forum: 5, records: 6 };
  var CALLS = {
    index:   ['/auth/handshake', '/session/refresh', '/presence/ping'],
    catalog: ['/catalog/index?page=1', '/catalog/holds', '/auth/check'],
    faq:     ['/faq/tickets?state=open', '/auth/check'],
    forum:   ['/forum/threads?sort=last', '/forum/presence', '/auth/check'],
    records: ['/records/query?level=4', '/records/seal/status', '/auth/check']
  };
  function log() { try { console.debug.apply(console, ['[net]'].concat([].slice.call(arguments))); } catch (e) {} }
  function tx(path, retry) {
    return new Promise(function (res) {
      var t = 160 + Math.random() * 620 | 0;
      setTimeout(function () {
        if (!retry && Math.random() < 0.25) { log('GET', path, 'timeout', t + 'ms, retry'); return res(tx(path, 1)); }
        var st = /auth|seal/.test(path) ? 403 : 200;
        log('GET', path, st, t + 'ms'); res(st);
      }, t);
    });
  }

  window.VK = {
    seed: seed,
    match: function (c) {
      for (var i = 1; i <= 6; i++) {
        if (i <= 2 ? h32('s' + i + ':' + c) === K[i] : c === personal(i)) return i;
      }
      return 0;
    },
    has: function (i) { return ((mask >> i) & 1) === 1; },
    add: function (i) { mask |= (1 << i); put('vk_mask', String(mask)); },
    count: function () { var n = 0; for (var i = 1; i <= 5; i++) n += (mask >> i) & 1; return n; },
    boot: function (page) {
      try { document.cookie = 'sid=' + h32(seed + ':sid').toString(16) + '; path=/; max-age=86400; SameSite=Lax'; } catch (e) {}
      var p = (CALLS[page] || []).reduce(function (q, path) { return q.then(function () { return tx(path); }); }, Promise.resolve());
      setInterval(function () { if (document.visibilityState === 'visible') tx('/presence/ping', 1); }, 45000);
      return p;
    },
    refLine: function (box, page) {
      var n = PAGE_CODE[page], c = null;
      if (n === 6) { if (this.count() >= 5) c = personal(6); } else if (n) c = personal(n);
      var d = document.createElement('div');
      d.textContent = c ? 'ref ' + c.slice(0, 4) + '-' + c.slice(4) : 'ref pending';
      d.style.cssText = 'font:11px "Courier New",monospace;letter-spacing:2px;color:#3b3b3b;margin-top:2.4rem;opacity:0;transition:opacity 2.5s ease-in';
      box.appendChild(d);
      setTimeout(function () { d.style.opacity = '1'; }, 2800);
    }
  };
})();

<script>
  const start      = document.getElementById('start');
  const startText  = document.getElementById('start-text');
  const subText    = document.getElementById('sub-text');
  const stage      = document.getElementById('stage');
  const audio      = document.getElementById('track');
  const img        = document.getElementById('mystery');
  const codebox    = document.getElementById('codebox');
  const input      = document.getElementById('code');
  const msg        = document.getElementById('msg');
  const decay      = document.getElementById('decay');
  const psycho     = document.getElementById('psycho');
  const psychoText = document.getElementById('psycho-text');
  const commentbox = document.getElementById('commentbox');
  const commentInp = document.getElementById('comment');
  const screamer   = document.getElementById('screamer');
  const screamerAu = document.getElementById('screamer-audio');
  const finalLink  = document.getElementById('finalLink');

  let msgTimeout = null;

  // ===== Хранилище состояния квеста =====
  function safeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) {}
  }

  // ===== visits (counted once per tab session) =====
  let visitCount = 0;
  try {
    visitCount = parseInt(safeGet('visitCount') || '0', 10) || 0;
    if (!sessionStorage.getItem('vk_seen')) {
      visitCount += 1; safeSet('visitCount', String(visitCount)); sessionStorage.setItem('vk_seen', '1');
    }
  } catch (e) { visitCount = 0; }
  const completed = safeGet('vk_completed') === '1';
  VK.boot('index');

  // ===== Текст стартового экрана =====
  if (completed) {
    startText.textContent = 'Welcome back.';
    subText.textContent = 'click to enter...';
    setTimeout(() => subText.classList.add('visible'), 1500);
  } else if (visitCount >= 3) {
    startText.textContent = 'Welcome back.';
    subText.textContent = 'click to enter...';
    setTimeout(() => subText.classList.add('visible'), 1500);
  }

  start.addEventListener('click', () => {
    audio.volume = 0.4;
    const p = audio.play();
    if (p && typeof p.catch === 'function') p.catch(() => {});
    if (VK.count() >= 5) triggerDetune();

    start.classList.add('hidden');
    setTimeout(() => stage.classList.add('visible'), 50);
    setTimeout(() => img.classList.add('loaded'), 100);

    if (completed) {
      setTimeout(() => finalLink.classList.add('visible'), 500);
    } else {
      setTimeout(() => codebox.classList.add('visible'), 400);
      setTimeout(() => input.focus(), 800);
    }
  });

  function say(text, ms) {
    msg.textContent = text;
    msg.classList.add('show');
    if (msgTimeout) clearTimeout(msgTimeout);
    msgTimeout = setTimeout(() => msg.classList.remove('show'), ms || 2600);
  }

  // ===== Детюн трека (код #5) =====
  let audioCtx = null;
  let detuned = false;

  function triggerDetune() {
    if (detuned) return;
    detuned = true;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const sourceNode = audioCtx.createMediaElementSource(audio);
      const filterNode = audioCtx.createBiquadFilter();
      filterNode.type = 'lowpass';
      filterNode.frequency.value = 20000;
      sourceNode.connect(filterNode).connect(audioCtx.destination);
      filterNode.frequency.exponentialRampToValueAtTime(380, audioCtx.currentTime + 3);

      const startRate = audio.playbackRate || 1;
      const endRate = 0.72;
      const start = performance.now();
      const duration = 3000;
      function step(now) {
        const t = Math.min(1, (now - start) / duration);
        audio.playbackRate = startRate + (endRate - startRate) * t;
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    } catch (e) {
      // если Web Audio недоступен — тихо продолжаем без эффекта
    }
  }

  // ===== Проверка кода =====
  function submitCode() {
    const code = input.value;
    if (code.length < 8) return;
    input.value = '';
    const n = VK.match(code);
    if (!n) return say('no such code exists', 2000);
    if (n === 6) {
      if (VK.count() < 5) return say('the last one is not listening yet.', 3200);
      return beginFinale();
    }
    if (VK.has(n)) return say('organ ' + n + ' already on file', 2400);
    VK.add(n);
    say('organ ' + n + ' accepted');
    if (VK.count() >= 5) triggerDetune();
  }

  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 8);
    if (input.value.length === 8) submitCode();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    submitCode();
  });

  // ===== Финальная цепочка (код #6) =====
  function beginFinale() {
    codebox.classList.remove('visible');
    input.blur();
    input.disabled = true;

    try { audio.pause(); } catch (e) {}

    decay.classList.add('visible');
    runDecay();
  }

  function spawnGlitchBar() {
    const bar = document.createElement('div');
    bar.className = 'glitch-bar';
    bar.style.top = (Math.random() * 100) + 'vh';
    bar.style.height = (2 + Math.random() * 18) + 'px';
    bar.style.opacity = (0.15 + Math.random() * 0.5).toFixed(2);
    decay.appendChild(bar);
    setTimeout(() => bar.remove(), 220 + Math.random() * 260);
  }

  function runDecay() {
    const totalDuration = 9000;
    const stepTime = 140;
    const steps = Math.round(totalDuration / stepTime);
    let i = 0;
    const timer = setInterval(() => {
      i++;
      const intensity = i / steps;
      if (Math.random() < 0.18 + intensity * 0.3) spawnGlitchBar();
      if (i >= steps) {
        clearInterval(timer);
        flashAndCut();
      }
    }, stepTime);
  }

  function flashAndCut() {
    decay.classList.add('flash');
    setTimeout(() => {
      decay.classList.remove('visible', 'flash');
      decay.innerHTML = '';
      startPsycho();
    }, 260);
  }

  const sysLines = ["connection to 10.4.0.3 timed out", "retrying (1/3)", "retrying (2/3)", "session token rejected", "restoring session", "restore failed: record locked by another reader"];
  const storyLines = [
    "this page used to be a waiting list. i don't know who changed it.",
    "my mother was on it, kidneys. winter of 2003, it snowed for weeks.",
    "they gave her a number and said write it on your arm so you don't lose it. she lost everything. gloves, keys, me once at the market.",
    "the call came around four in the morning. a man said we have six for you.",
    "she said six what. he said it doesn't matter, just come and sit.",
    "i drove. there was a lobby with a vending machine in it and nothing else. no desk, no sign, the machine was on.",
    "a corridor, six doors. she went in the first one and i stayed by the machine.",
    "i could hear her talking in there, normal voice, like when she called her sister.",
    "second door. third. i stopped looking at my watch, i should have kept looking.",
    "after the fifth she came out and walked past me and stood facing the wall.",
    "i said mom. she said not yet, quiet, like i'd interrupted someone.",
    "the sixth door was open with the light on. nobody went in. she never went in.",
    "she's fine. kidneys fine, nobody touched her. she doesn't eat anymore but she isn't thin.",
    "i kept the number. it's still on my arm if i don't wash it.",
    "i'm putting this here because that's where it said to put it.",
    "you got to the sixth one. it's open on your side too.",
    "don't stand in the corridor. i did, for years.",
    "there's a box if you want to say something. i used to think i was the one reading them."
];
  const seq = sysLines.map(t => [t, 1300, '#4a4a4a'])
    .concat(storyLines.map((t, i) => [t, 1400 + t.length * 38, i >= storyLines.length - 3 ? '#6a2a2a' : '#8a8a8a']));

  function startPsycho() {
    psycho.classList.add('visible');
    let idx = 0;
    function showNext() {
      if (idx >= seq.length) {
        psycho.classList.remove('visible');
        setTimeout(startComment, 600);
        return;
      }
      const [text, hold, color] = seq[idx++];
      psychoText.style.color = color;
      psychoText.textContent = text;
      psychoText.classList.add('show');
      setTimeout(() => {
        psychoText.classList.remove('show');
        setTimeout(showNext, 450);
      }, hold);
    }
    showNext();
  }

  function startComment() {
    commentbox.classList.add('visible');
    setTimeout(() => commentInp.focus(), 400);
  }

  commentInp.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (!commentInp.value.trim()) return;
    safeSet('vk_comment', commentInp.value.trim());
    commentbox.classList.remove('visible');
    setTimeout(triggerScreamer, 400);
  });

  function triggerScreamer() {
    screamer.classList.add('visible');
    try {
      screamerAu.currentTime = 0;
      const p = screamerAu.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    } catch (e) {}

    setTimeout(() => {
      screamer.classList.remove('visible');
      try { screamerAu.pause(); } catch (e) {}
      finishQuest();
    }, 10000);
  }

  function finishQuest() {
    safeSet('vk_completed', '1');
    finalLink.classList.add('visible');
  }
</script>
