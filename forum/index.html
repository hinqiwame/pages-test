<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>…</title>
<link rel="icon" href="../image.jpg" type="image/jpeg">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Courier New", Courier, monospace;
    color: #8a8a8a;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  body {
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  #deny {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    cursor: pointer;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0)
             env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    box-sizing: border-box;
    text-align: center;
  }

  #deny .message {
    color: #8a8a8a;
    font-size: 18px;
    letter-spacing: 2px;
    margin-bottom: 28px;
    max-width: 90vw;
    opacity: 0;
    transition: opacity 2.2s ease-in;
  }

  #deny .message.visible {
    opacity: 1;
    animation: flicker 4s infinite 2.2s;
  }

  #deny .back {
    color: #555;
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0;
    transition: opacity 1.8s ease-in, color 0.4s ease;
  }

  #deny .back.visible {
    opacity: 1;
  }

  @media (hover: hover) {
    #deny:hover .back {
      color: #8a8a8a;
    }
  }

  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.35; }
    22% { opacity: 0.7; }
  }
</style>
</head>
<body>

  <!-- thread locked after five replies. -->
  <!-- the sixth reply was removed by the administration before anyone could read it. -->
  <!-- user "guest_3812": "it only let me in after I'd already found the fifth one" -->
  <div id="deny">
    <div class="message">You do not have access to view this page.</div>
    <div class="back">click to go back</div>
  </div>

<script>
  const message = document.querySelector('#deny .message');
  const back = document.querySelector('#deny .back');

  setTimeout(() => message.classList.add('visible'), 400);
  setTimeout(() => back.classList.add('visible'), 1600);

  document.getElementById('deny').addEventListener('click', () => {
    window.location.href = 'https://wehaveyourorgans.com/';
  });
</script>

</body>
</html>
